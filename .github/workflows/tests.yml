name: Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        laravel: [ '10.*', '11.*', '12.*', '13.*' ]
        dependency-version: [ prefer-lowest, prefer-stable ]
        exclude:
          - { laravel: '10.*', php: '8.4' }
          - { laravel: '10.*', php: '8.5' }
          - { laravel: '11.*', php: '8.1' }
          - { laravel: '11.*', php: '8.5' }
          - { laravel: '12.*', php: '8.1' }
          - { laravel: '13.*', php: '8.1' }
          - { laravel: '13.*', php: '8.2' }

    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 10/11 are past end of life and every release is flagged by a security advisory.
          composer config --json policy '{"advisories":{"block":false}}'
          composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
